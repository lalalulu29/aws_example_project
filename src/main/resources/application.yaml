spring:
  application:
    name: aws_example_project
  datasource:
    url: jdbc:postgresql://${DB_ADDRESS}/
    name: ${DB_NAME}
    username: ${DB_LOGIN}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

aws:
  s3:
    region: ${S3_REGION}
    access_key: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
    bucket: ${S3_BUCKET}

server:
  port: 8080